<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bouncing Windows</title>
<style>
  @font-face {
    font-family: Chicago_12;
    src: url(https://unpkg.com/@sakun/system.css@0.1.11/dist/ChiKareGo2.woff2) format("woff2"),
         url(https://unpkg.com/@sakun/system.css@0.1.11/dist/ChiKareGo2.woff) format("woff");
  }
  @font-face {
    font-family: Chicago;
    src: url(https://unpkg.com/@sakun/system.css@0.1.11/dist/ChicagoFLF.woff2) format("woff2"),
         url(https://unpkg.com/@sakun/system.css@0.1.11/dist/ChicagoFLF.woff) format("woff");
  }
  @font-face {
    font-family: Monaco;
    src: url(https://unpkg.com/@sakun/system.css@0.1.11/dist/monaco.woff2) format("woff2"),
         url(https://unpkg.com/@sakun/system.css@0.1.11/dist/monaco.woff) format("woff");
  }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
  .font-preload { position: absolute; left: -9999px; font-size: 1px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head>
<body>
<span class="font-preload" style="font-family:Chicago_12">.</span>
<span class="font-preload" style="font-family:Chicago">.</span>
<span class="font-preload" style="font-family:Monaco">.</span>
<script>
// ── Mosaic piece params ────────────────────────────────────
const params = new URLSearchParams(location.search);
const piece = parseInt(params.get('piece')) || 0;
const mCols = parseInt(params.get('cols'))  || 1;
const mRows = parseInt(params.get('rows'))  || 1;
const mRow  = parseInt(params.get('row'))   || 0;
const mCol  = parseInt(params.get('col'))   || 0;

// ── Firebase ───────────────────────────────────────────────
const fbApp = firebase.initializeApp({
  apiKey:      "AIzaSyADqhr0xBlMsgGbm0q0I8cOJfnyIn3rbTg",
  authDomain:  "screengathering.firebaseapp.com",
  databaseURL: "https://screengathering-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:   "screengathering",
});
const db = firebase.database();
const SESSION = Math.random().toString(36).slice(2);

// ── Constants ──────────────────────────────────────────────
const TITLE_H = 36;
const CLOSE_SIZE = 14;
const CLOSE_MARGIN = 8;
const BODY_PAD = 1;

// ── Rhythm typing constants ──────────────────────────────
const CHAR_BASE = 19;
const CHAR_FONT = CHAR_BASE + 'px Monaco, "Courier New", monospace';
let charBitmapCache = {};

function getCharBitmap(ch) {
  if (charBitmapCache[ch]) return charBitmapCache[ch];
  const off = document.createElement('canvas');
  const octx = off.getContext('2d');
  octx.font = CHAR_FONT;
  const m = octx.measureText(ch);
  const cw = Math.ceil(m.width) + 1;
  const ch2 = CHAR_BASE + 4;
  off.width = cw; off.height = ch2;
  octx.font = CHAR_FONT;
  octx.fillStyle = '#000';
  octx.textBaseline = 'alphabetic';
  octx.fillText(ch, 0, CHAR_BASE);
  const img = octx.getImageData(0, 0, cw, ch2);
  for (let i = 0; i < img.data.length; i += 4) {
    if (img.data[i + 3] > 127) {
      img.data[i] = 0; img.data[i+1] = 0; img.data[i+2] = 0; img.data[i+3] = 255;
    } else { img.data[i+3] = 0; }
  }
  octx.putImageData(img, 0, 0);
  charBitmapCache[ch] = { canvas: off, w: cw, h: ch2 };
  return charBitmapCache[ch];
}

function random256Color() {
  const i = Math.floor(Math.random() * 256);
  if (i < 216) {
    const r = Math.floor(i / 36) * 51;
    const g = Math.floor((i % 36) / 6) * 51;
    const b = (i % 6) * 51;
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  const gray = Math.round((i - 216) * 255 / 39);
  return 'rgb(' + gray + ',' + gray + ',' + gray + ')';
}

// ── Window specs (deterministic across all machines) ───────
const WIN_SPECS = [
  { id: 0, type: 'image',  title: '1.png',           w: 270, h: 264, ox: 100,  oy: 80,   sx: 30,   sy: 22,   src: '1.png' },
  { id: 1, type: 'image',  title: '2.jpeg',          w: 260, h: 260, ox: 500,  oy: 200,  sx: -160, sy: 130,  src: '2.jpeg' },
  { id: 2, type: 'image',  title: '3.jpg',           w: 280, h: 261, ox: 900,  oy: 120,  sx: 55,   sy: -45,  src: '3.jpg' },
  { id: 3, type: 'image',  title: '4.jpg',           w: 250, h: 320, ox: 200,  oy: 400,  sx: -190, sy: 150,  src: '4.jpg' },
  { id: 4, type: 'canvas', title: 'Drawing Pad',     w: 400, h: 320, ox: 700,  oy: 500,  sx: 70,   sy: -50 },
  { id: 5, type: 'typing', title: 'Untitled.txt',    w: 580, h: 460, ox: 350,  oy: 300,  sx: -75,  sy: 55 },
  { id: 6, type: 'typing', title: 'Notes.txt',       w: 520, h: 400, ox: 800,  oy: 350,  sx: 200,  sy: -165 },
];

// ── Font loading ──────────────────────────────────────────
let fontsReady = false;
document.fonts.ready.then(() => { fontsReady = true; });

// ── State ──────────────────────────────────────────────────
let windows = [];
let activeWinId = -1;
let drawingInCanvas = false;
let prevBufX, prevBufY;
let totalCols = mCols;   // live grid from Firebase, fallback to URL params
let totalRows = mRows;
let gridOverride = null;
let fbParticipantCount = 0;
let draggingWinId = -1;
let dragOffsetX = 0, dragOffsetY = 0;
let dragLastMovingX = 0, dragLastMovingY = 0;
let resizingWinId = -1;
let bgImg = null;

// ── Triangle wave (deterministic bounce) ───────────────────
function triangleWave(val, range) {
  if (range <= 0) return 0;
  val = ((val % (range * 2)) + range * 2) % (range * 2);
  return val <= range ? val : range * 2 - val;
}

// ── Grid from Firebase participant count ───────────────────
function computeGrid(N) {
  if (gridOverride && gridOverride.cols && gridOverride.rows)
    return { cols: Math.max(1, gridOverride.cols), rows: Math.max(1, gridOverride.rows) };
  N = Math.max(1, N);
  let bestRows = 1;
  for (let r = 1; r * r <= N; r++) {
    if (N % r === 0) bestRows = r;
  }
  return { cols: N / bestRows, rows: bestRows };
}

// ── Coordinate transforms ──────────────────────────────────
// Bounce space = total connected screens (live from Firebase)
function bounceW() { return width * totalCols; }
function bounceH() { return height * totalRows; }
// Viewport position: derived from piece index + Firebase grid (not URL col/row)
function myCol() { return piece % totalCols; }
function myRow() { return Math.floor(piece / totalCols); }
function toCompX(sx) { return sx + myCol() * width; }
function toCompY(sy) { return sy + myRow() * height; }

// ── Setup ──────────────────────────────────────────────────
function setup() {
  let c = createCanvas(windowWidth, windowHeight);
  c.elt.setAttribute('tabindex', '0');
  c.elt.style.outline = 'none';
  c.elt.focus();
  textFont('monospace');
  noSmooth();

  // Load background image (swap bg.png for your own image)
  loadImage('bg.png',
    img => { bgImg = img; },
    ()  => { bgImg = null; }
  );

  for (let spec of WIN_SPECS) {
    let win = {
      id: spec.id, type: spec.type, title: spec.title,
      w: spec.w, h: spec.h,
      ox: spec.ox, oy: spec.oy, sx: spec.sx, sy: spec.sy,
      x: 0, y: 0,
      active: false,
    };

    if (spec.type === 'image') {
      win.img = null;
      if (spec.src) {
        loadImage(spec.src,
          img => { win.img = img; },
          ()  => { win.img = null; }
        );
      }
    }
    if (spec.type === 'canvas') {
      let bw = spec.w - BODY_PAD * 2;
      let bh = spec.h - TITLE_H - BODY_PAD;
      win.gfx = createGraphics(bw, bh);
      win.gfx.background(255);
    }
    if (spec.type === 'typing') {
      win.rhythm = [];
      win.pressStarts = {};
      win.lastRelease = 0;
    }

    windows.push(win);
  }

  initFirebase();

  // Push current WIN_SPECS speeds to Firebase so they override any stale values
  for (let w of windows) {
    pushOffsets(w);
  }
}

// ── Firebase listeners ─────────────────────────────────────
function initFirebase() {
  // Live participant count → bounce space
  db.ref('mosaic/participants').on('value', snap => {
    const p = snap.val();
    const N = p ? Object.keys(p).length : 0;
    fbParticipantCount = N;
    if (N > 0) {
      const grid = computeGrid(N);
      totalCols = grid.cols;
      totalRows = grid.rows;
    }
  });
  db.ref('mosaic/state/gridOverride').on('value', snap => {
    gridOverride = snap.val();
    if (fbParticipantCount > 0) {
      const grid = computeGrid(fbParticipantCount);
      totalCols = grid.cols;
      totalRows = grid.rows;
    }
  });

  // Synced bounce offsets (when someone drags a window on another screen)
  db.ref('bouncing-windows/offsets').on('value', snap => {
    const offsets = snap.val();
    if (!offsets) return;
    for (let w of windows) {
      if (offsets[w.id] && offsets[w.id].sender !== SESSION) {
        w.ox = offsets[w.id].ox;
        w.oy = offsets[w.id].oy;
        if (offsets[w.id].sx != null) w.sx = offsets[w.id].sx;
        if (offsets[w.id].sy != null) w.sy = offsets[w.id].sy;
      }
    }
  });

  for (let w of windows) {
    if (w.type === 'canvas') {
      db.ref('bouncing-windows/strokes/' + w.id).on('child_added', snap => {
        const s = snap.val();
        if (!s || s.sender === SESSION) return;
        if (w.gfx) {
          w.gfx.stroke(0);
          w.gfx.strokeWeight(2);
          w.gfx.line(s.x1, s.y1, s.x2, s.y2);
        }
      });
    }
    if (w.type === 'typing') {
      db.ref('bouncing-windows/rhythm/' + w.id).on('value', snap => {
        const data = snap.val();
        if (!data || data.sender === SESSION) return;
        w.rhythm = (data.rhythm || []).map(r => ({
          char: r.char, pauseBefore: r.pauseBefore,
          holdDuration: r.holdDuration, addedAt: 0,
          patternIndex: r.patternIndex || 0, color: r.color || '#000',
        }));
      });
    }
  }
}

function pushStroke(winId, x1, y1, x2, y2) {
  db.ref('bouncing-windows/strokes/' + winId).push({
    x1, y1, x2, y2, sender: SESSION
  });
}

function pushRhythm(w) {
  db.ref('bouncing-windows/rhythm/' + w.id).set({
    rhythm: w.rhythm.map(r => ({
      char: r.char, pauseBefore: r.pauseBefore,
      holdDuration: r.holdDuration,
      patternIndex: r.patternIndex || 0, color: r.color || '#000',
    })),
    sender: SESSION,
  });
}

function pushOffsets(w) {
  db.ref('bouncing-windows/offsets/' + w.id).set({
    ox: w.ox, oy: w.oy, sx: w.sx, sy: w.sy, sender: SESSION,
  });
}

// ── Draw loop ──────────────────────────────────────────────
function draw() {
  if (bgImg) {
    image(bgImg, 0, 0, width, height);
  } else {
    background(0);
  }

  const t = Date.now() / 1000;
  const W = bounceW();
  const H = bounceH();

  // Compute deterministic positions from wall-clock time
  for (let w of windows) {
    if (w.id === draggingWinId || w.id === resizingWinId) continue;
    let rangeX = W - w.w;
    let rangeY = H - w.h;
    w.x = rangeX > 0 ? triangleWave(w.ox + w.sx * t, rangeX) : 0;
    w.y = rangeY > 0 ? triangleWave(w.oy + w.sy * t, rangeY) : 0;
  }

  // Safety: release stuck drags if mouse left iframe
  if (draggingWinId !== -1 && !mouseIsPressed) finishDrag();
  if (resizingWinId !== -1 && !mouseIsPressed) resizingWinId = -1;

  // Draw in composition space, offset to this piece
  push();
  translate(-myCol() * width, -myRow() * height);

  for (let w of windows) {
    drawWindow(w);
  }

  pop();

  // Screen boundary markers (dashed lines where screens meet)
  push();
  translate(-myCol() * width, -myRow() * height);
  stroke(60);
  strokeWeight(1);
  drawingContext.setLineDash([6, 8]);
  for (let c = 1; c < totalCols; c++) {
    line(c * width, 0, c * width, height * totalRows);
  }
  for (let r = 1; r < totalRows; r++) {
    line(0, r * height, width * totalCols, r * height);
  }
  drawingContext.setLineDash([]);
  pop();

  // Piece label
  noStroke();
  fill(80);
  textSize(11);
  textFont('Geneva, Helvetica, sans-serif');
  textAlign(LEFT, TOP);
  text(`piece ${piece}  ${totalCols}\u00d7${totalRows}  (${myRow()},${myCol()})`, 10, height - 18);
}

// ── Draw a single window ──────────────────────────────────
function drawWindow(w) {
  push();
  translate(w.x, w.y);

  // Drop shadow
  noStroke();
  fill(0, 0, 0, 80);
  rect(3, 3, w.w, w.h);

  // Window border
  stroke(0);
  strokeWeight(2);
  fill(255);
  rect(0, 0, w.w, w.h);

  // Title bar background
  noStroke();
  fill(255);
  rect(1, 1, w.w - 2, TITLE_H);

  // Title bar stripes (always shown)
  stroke(0);
  strokeWeight(1);
  let stripeStart = CLOSE_MARGIN + CLOSE_SIZE + 6;
  let stripeEnd = w.w - 8;
  const titleFont = 'bold 25px Chicago_12, Chicago, ChicagoFLF, "Courier New", monospace';
  drawingContext.font = titleFont;
  let tw = drawingContext.measureText(w.title).width;
  let titleCenter = w.w / 2;
  let gapLeft = titleCenter - tw / 2 - 6;
  let gapRight = titleCenter + tw / 2 + 6;
  for (let sy = 5; sy < TITLE_H - 3; sy += 3) {
    if (stripeStart < gapLeft)
      line(stripeStart, sy, min(gapLeft, stripeEnd), sy);
    if (gapRight < stripeEnd)
      line(max(gapRight, stripeStart), sy, stripeEnd, sy);
  }

  // Close box
  stroke(0);
  strokeWeight(1.5);
  noFill();
  let cbx = CLOSE_MARGIN;
  let cby = (TITLE_H - CLOSE_SIZE) / 2;
  rect(cbx, cby, CLOSE_SIZE, CLOSE_SIZE);
  if (w.active) {
    rect(cbx + 3, cby + 3, CLOSE_SIZE - 6, CLOSE_SIZE - 6);
  }

  // Title text (native canvas for proper CSS font fallback)
  noStroke();
  fill(255);
  rect(w.w / 2 - tw / 2 - 5, 3, tw + 10, TITLE_H - 6);
  drawingContext.font = titleFont;
  drawingContext.textAlign = 'center';
  drawingContext.textBaseline = 'middle';
  drawingContext.fillStyle = w.active ? '#000' : '#a5a5a5';
  drawingContext.fillText(w.title, w.w / 2, TITLE_H / 2);

  // Separator
  stroke(0);
  strokeWeight(1);
  line(0, TITLE_H, w.w, TITLE_H);

  // Body content (clipped)
  let bodyX = BODY_PAD;
  let bodyY = TITLE_H + BODY_PAD;
  let bodyW = w.w - BODY_PAD * 2;
  let bodyH = w.h - TITLE_H - BODY_PAD;

  push();
  drawingContext.save();
  drawingContext.beginPath();
  drawingContext.rect(bodyX, bodyY, bodyW, bodyH);
  drawingContext.clip();

  if (w.type === 'image')  drawImageContent(w, bodyX, bodyY, bodyW, bodyH);
  if (w.type === 'canvas') drawCanvasContent(w, bodyX, bodyY, bodyW, bodyH);
  if (w.type === 'typing') drawTypingContent(w, bodyX, bodyY, bodyW, bodyH);

  drawingContext.restore();
  pop();

  // Resize lines
  stroke(0);
  strokeWeight(1.5);
  line(w.w - 4, w.h - 14, w.w - 14, w.h - 4);
  line(w.w - 4, w.h - 10, w.w - 10, w.h - 4);
  line(w.w - 4, w.h - 6,  w.w - 6,  w.h - 4);

  pop();
}

// ── Image content ─────────────────────────────────────────
function drawImageContent(w, bx, by, bw, bh) {
  if (!w.img) {
    noStroke(); fill(220);
    rect(bx, by, bw, bh);
    fill(120); textSize(12);
    textAlign(CENTER, CENTER);
    text('Loading...', bx + bw / 2, by + bh / 2);
    textAlign(LEFT, TOP);
    return;
  }
  let imgA = w.img.width / w.img.height;
  let boxA = bw / bh;
  let dw, dh;
  if (imgA > boxA) { dh = bh; dw = bh * imgA; }
  else             { dw = bw; dh = bw / imgA; }
  image(w.img, bx + (bw - dw) / 2, by + (bh - dh) / 2, dw, dh);
}

// ── Canvas content ────────────────────────────────────────
function drawCanvasContent(w, bx, by, bw, bh) {
  if (w.gfx) image(w.gfx, bx, by, bw, bh);

}

// ── Typing content (rhythm) ───────────────────────────────
function drawTypingContent(w, bx, by, bw, bh) {
  const now = performance.now();
  const pad = 6;
  const lineH = 31;
  const minSize = 17;
  const maxSize = 46;
  const maxHold = 500;
  const pauseScale = 0.02;
  const growDuration = 200;

  let x = bx + pad;
  let y = by + pad + lineH * 0.75;

  drawingContext.imageSmoothingEnabled = false;

  for (let i = 0; i < w.rhythm.length; i++) {
    const item = w.rhythm[i];
    if (item.char === '\n') { x = bx + pad; y += lineH; continue; }

    const hold = Math.min(Math.max(item.holdDuration, 0), maxHold);
    const sz = minSize + (hold / maxHold) * (maxSize - minSize);
    const gap = Math.min(item.pauseBefore * pauseScale, bw - pad * 2);

    const age = item.addedAt ? now - item.addedAt : growDuration;
    const t = Math.min(age / growDuration, 1);
    const eased = t < 1 ? t * (2 - t) : 1;
    const animSz = sz * (0.3 + 0.7 * eased);

    const bmp = getCharBitmap(item.char);
    const sc = animSz / CHAR_BASE;
    const charW = bmp.w * sc;
    const drawH = bmp.h * sc;

    if (x + gap + charW > bx + bw - pad && x > bx + pad) {
      x = bx + pad; y += lineH;
    } else { x += gap; }

    drawingContext.drawImage(bmp.canvas,
      Math.round(x), Math.round(y - CHAR_BASE * 0.85 * sc),
      Math.round(charW), Math.round(drawH));
    x += charW;
  }

  // Live preview of held key
  for (const code in w.pressStarts) {
    const press = w.pressStarts[code];
    if (!press) continue;
    const liveHold = Math.min(now - press.t, maxHold);
    const liveSz = minSize + (liveHold / maxHold) * (maxSize - minSize);
    const liveGap = Math.min(press.pauseBefore * pauseScale, bw - pad * 2);

    const bmp = getCharBitmap(press.char);
    const sc = liveSz / CHAR_BASE;
    const charW = bmp.w * sc;
    const drawH = bmp.h * sc;

    if (x + liveGap + charW > bx + bw - pad && x > bx + pad) {
      x = bx + pad; y += lineH;
    } else { x += liveGap; }

    drawingContext.drawImage(bmp.canvas,
      Math.round(x), Math.round(y - CHAR_BASE * 0.85 * sc),
      Math.round(charW), Math.round(drawH));
    x += charW;
    break;
  }

  // Blinking cursor
  if (w.active) {
    const hasActive = Object.keys(w.pressStarts).length > 0;
    if (!hasActive) {
      if (w.lastRelease > 0) {
        const drift = Math.min((now - w.lastRelease) * pauseScale, bw - pad * 2);
        noStroke(); fill(0);
        rect(x + drift + 1, y - lineH * 0.55, 2, lineH * 0.6);
      } else if ((frameCount % 60) < 35) {
        noStroke(); fill(0);
        rect(x + 1, y - lineH * 0.55, 2, lineH * 0.6);
      }
    }
  }
}

// ── Hit testing (composition space) ───────────────────────
function windowAtComp(cx, cy) {
  for (let i = windows.length - 1; i >= 0; i--) {
    let w = windows[i];
    if (cx >= w.x && cx <= w.x + w.w && cy >= w.y && cy <= w.y + w.h)
      return w;
  }
  return null;
}

function isInBody(w, cx, cy) {
  let lx = cx - w.x, ly = cy - w.y;
  return lx > BODY_PAD && lx < w.w - BODY_PAD &&
         ly > TITLE_H + BODY_PAD && ly < w.h - BODY_PAD;
}

function isInTitleBar(w, cx, cy) {
  let lx = cx - w.x, ly = cy - w.y;
  return lx > 0 && lx < w.w && ly > 0 && ly < TITLE_H;
}

function isInResizeCorner(w, cx, cy) {
  let lx = cx - w.x, ly = cy - w.y;
  return lx > w.w - 16 && lx <= w.w && ly > w.h - 16 && ly <= w.h;
}

function isInCloseBox(w, cx, cy) {
  let lx = cx - w.x, ly = cy - w.y;
  return lx >= CLOSE_MARGIN && lx <= CLOSE_MARGIN + CLOSE_SIZE &&
         ly >= (TITLE_H - CLOSE_SIZE) / 2 && ly <= (TITLE_H + CLOSE_SIZE) / 2;
}

function bringToFront(win) {
  let idx = windows.indexOf(win);
  if (idx !== -1 && idx !== windows.length - 1) {
    windows.splice(idx, 1);
    windows.push(win);
  }
}

function finishDrag() {
  if (draggingWinId === -1) return;
  let w = windows.find(w => w.id === draggingWinId);
  if (w) {
    let t = Date.now() / 1000;
    let rangeX = max(1, bounceW() - w.w);
    let rangeY = max(1, bounceH() - w.h);
    // Flip speed direction to match mouse movement
    let dx = w.x - dragLastMovingX;
    let dy = w.y - dragLastMovingY;
    if (abs(dx) > 2) w.sx = (dx > 0 ? 1 : -1) * abs(w.sx);
    if (abs(dy) > 2) w.sy = (dy > 0 ? 1 : -1) * abs(w.sy);
    w.x = constrain(w.x, 0, rangeX);
    w.y = constrain(w.y, 0, rangeY);
    w.ox = w.x - w.sx * t;
    w.oy = w.y - w.sy * t;
    pushOffsets(w);
  }
  draggingWinId = -1;
}

// ── Mouse events ──────────────────────────────────────────
function mousePressed() {
  let cx = toCompX(mouseX), cy = toCompY(mouseY);
  let hit = windowAtComp(cx, cy);

  if (!hit) {
    activeWinId = -1;
    for (let w of windows) w.active = false;
    return;
  }

  bringToFront(hit);
  activeWinId = hit.id;
  for (let w of windows) w.active = (w.id === hit.id);

  if (isInResizeCorner(hit, cx, cy)) {
    resizingWinId = hit.id;
    return;
  }

  if (isInTitleBar(hit, cx, cy) && !isInCloseBox(hit, cx, cy)) {
    draggingWinId = hit.id;
    dragOffsetX = cx - hit.x;
    dragOffsetY = cy - hit.y;
    dragLastMovingX = hit.x;
    dragLastMovingY = hit.y;
    return;
  }

  if (hit.type === 'canvas' && isInBody(hit, cx, cy)) {
    drawingInCanvas = true;
    let bodyW = hit.w - BODY_PAD * 2;
    let bodyH = hit.h - TITLE_H - BODY_PAD;
    prevBufX = map(cx - hit.x - BODY_PAD, 0, bodyW, 0, hit.gfx.width);
    prevBufY = map(cy - hit.y - TITLE_H - BODY_PAD, 0, bodyH, 0, hit.gfx.height);
  }

  if (hit.type === 'typing') {
    document.querySelector('canvas').focus();
  }
}

function mouseDragged() {
  if (resizingWinId !== -1) {
    let w = windows.find(w => w.id === resizingWinId);
    if (w) {
      let cx = toCompX(mouseX), cy = toCompY(mouseY);
      w.w = max(200, cx - w.x);
      w.h = max(120, cy - w.y);
    }
    return;
  }

  if (draggingWinId !== -1) {
    let w = windows.find(w => w.id === draggingWinId);
    if (w) {
      let oldX = w.x, oldY = w.y;
      w.x = toCompX(mouseX) - dragOffsetX;
      w.y = toCompY(mouseY) - dragOffsetY;
      if (abs(w.x - oldX) > 1 || abs(w.y - oldY) > 1) {
        dragLastMovingX = oldX;
        dragLastMovingY = oldY;
      }
    }
    return;
  }

  if (!drawingInCanvas) return;
  let active = windows.find(w => w.id === activeWinId && w.type === 'canvas');
  if (!active || !active.gfx) return;

  let cx = toCompX(mouseX), cy = toCompY(mouseY);
  let bodyW = active.w - BODY_PAD * 2;
  let bodyH = active.h - TITLE_H - BODY_PAD;
  let bufX = map(cx - active.x - BODY_PAD, 0, bodyW, 0, active.gfx.width);
  let bufY = map(cy - active.y - TITLE_H - BODY_PAD, 0, bodyH, 0, active.gfx.height);

  active.gfx.stroke(0);
  active.gfx.strokeWeight(2);
  active.gfx.line(prevBufX, prevBufY, bufX, bufY);
  pushStroke(active.id, prevBufX, prevBufY, bufX, bufY);
  prevBufX = bufX;
  prevBufY = bufY;
}

function mouseReleased() {
  if (resizingWinId !== -1) {
    let w = windows.find(w => w.id === resizingWinId);
    if (w) {
      let t = Date.now() / 1000;
      let rangeX = max(1, bounceW() - w.w);
      let rangeY = max(1, bounceH() - w.h);
      w.x = constrain(w.x, 0, rangeX);
      w.y = constrain(w.y, 0, rangeY);
      w.ox = w.x - w.sx * t;
      w.oy = w.y - w.sy * t;
      pushOffsets(w);
    }
    resizingWinId = -1;
    return;
  }
  if (draggingWinId !== -1) {
    finishDrag();
    return;
  }
  drawingInCanvas = false;
}

// ── Keyboard events (rhythm tracking) ─────────────────────
function keyPressed() {
  let active = windows.find(w => w.id === activeWinId && w.type === 'typing');
  if (!active) return;

  if (key.length === 1 && key.charCodeAt(0) >= 32) {
    const now = performance.now();
    active.pressStarts[keyCode] = {
      t: now,
      pauseBefore: active.lastRelease === 0 ? 0 : now - active.lastRelease,
      char: key,
      patternIndex: Math.floor(Math.random() * 18),
      color: random256Color(),
    };
    return false;
  }

  if (keyCode === ENTER || keyCode === RETURN) {
    const now = performance.now();
    active.rhythm.push({
      char: '\n', pauseBefore: active.lastRelease === 0 ? 0 : now - active.lastRelease,
      holdDuration: 0, addedAt: now, patternIndex: 0, color: '#000',
    });
    active.lastRelease = now;
    pushRhythm(active);
    return false;
  }

  if (keyCode === BACKSPACE) {
    if (active.rhythm.length > 0) {
      active.rhythm.pop();
      pushRhythm(active);
    }
    return false;
  }
}

function keyReleased() {
  let active = windows.find(w => w.id === activeWinId && w.type === 'typing');
  if (!active) return;

  const start = active.pressStarts[keyCode];
  if (!start) return;
  delete active.pressStarts[keyCode];

  const now = performance.now();
  active.rhythm.push({
    char: start.char,
    pauseBefore: start.pauseBefore,
    holdDuration: now - start.t,
    addedAt: now,
    patternIndex: start.patternIndex,
    color: start.color,
  });
  active.lastRelease = now;
  pushRhythm(active);
}

// ── Resize ────────────────────────────────────────────────
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
