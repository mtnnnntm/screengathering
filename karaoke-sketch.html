<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Karaoke — MosaicSaver sketch</title>
<style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
    canvas { display: block; background: transparent; }
</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
</head>
<body>
<script>
const FIREBASE_CONFIG = {
    apiKey:      "AIzaSyADqhr0xBlMsgGbm0q0I8cOJfnyIn3rbTg",
    authDomain:  "screengathering.firebaseapp.com",
    databaseURL: "https://screengathering-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:   "screengathering",
};

/* ------------------------------------------------------------------------
   Default lyrics — used when no custom lyrics exist in Firebase.
   ----------------------------------------------------------------- */
const SONG = {
    lines: [
        [ 0.0, "" ],
        [ 1.0, "哈哈哈哈哈哈哈哈哈哈哈哈哈哈" ],
        [ 5.0, "啦啦啦啦啦啦啦啦啦啦啦啦啦啦" ],
        [10.0, "" ],
    ],

    startTime: null,
    loop: true,
};

const UNSUNG_OUTLINE = [  0,   0,   0];
const UNSUNG_FILL    = [255, 255, 255];
const SUNG_OUTLINE   = [255, 255, 255];
const SUNG_FILL      = [  0,  60, 255];

const OUTLINE_RATIO = 0.08;

/* --------------------------------------------------------------- */

if (window.self === window.top) {
    document.documentElement.style.background = '#0a0a0a';
    document.body.style.background = '#0a0a0a';
}

const params = new URLSearchParams(location.search);
const piece = parseInt(params.get('piece')) || 0;
const cols  = parseInt(params.get('cols'))  || 1;
const rows  = parseInt(params.get('rows'))  || 1;
const row   = parseInt(params.get('row'))   || 0;
const col   = parseInt(params.get('col'))   || 0;

let songDuration;
let originSec;   // wall-clock reference the song is measured against

// Load custom lyrics from Firebase (async, doesn't block p5.js)
(async () => {
    try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
        const { getDatabase, ref, onValue } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js");
        const app = initializeApp(FIREBASE_CONFIG);
        const db = getDatabase(app);
        onValue(ref(db, 'mosaic/state/karaokeLyrics'), (snap) => {
            const data = snap.val();
            if (data) {
                SONG.lines = JSON.parse(data);
                songDuration = SONG.lines[SONG.lines.length - 1][0];
            }
        });
    } catch (e) {
        console.warn('Firebase init failed in karaoke sketch:', e);
    }
})();

function setup() {
    createCanvas(windowWidth, windowHeight);
    songDuration = SONG.lines[SONG.lines.length - 1][0];

    // Sync strategy:
    // - startTime null → origin is Unix epoch (0). Every machine computes
    //   (Date.now()/1000) % songDuration, so they all agree without any
    //   coordination or setup. NTP-synced clocks stay within ~50ms.
    // - startTime set → origin is that specific timestamp. Same math, but
    //   the "phase" is anchored to a chosen moment.
    if (SONG.startTime) {
        originSec = new Date(SONG.startTime).getTime() / 1000;
    } else {
        originSec = 0;
    }
}

function currentSongTime() {
    const elapsed = Date.now() / 1000 - originSec;
    if (SONG.loop && songDuration > 0) {
        return ((elapsed % songDuration) + songDuration) % songDuration;
    }
    return elapsed;
}

function lineAt(t) {
    for (let i = SONG.lines.length - 1; i >= 0; i--) {
        if (t >= SONG.lines[i][0]) return i;
    }
    return 0;
}

function drawOutlinedText(txt, cx, cy, strokeW, outlineC, fillC) {
    noFill();
    stroke(outlineC[0], outlineC[1], outlineC[2]);
    strokeWeight(strokeW);
    text(txt, cx, cy);

    noStroke();
    fill(fillC[0], fillC[1], fillC[2]);
    text(txt, cx, cy);
}

function draw() {
    clear();

    const t = currentSongTime();
    const idx = lineAt(t);
    const currentText = SONG.lines[idx][1] || "";
    if (!currentText) return;

    const lineStart = SONG.lines[idx][0];
    const lineEnd = idx + 1 < SONG.lines.length
        ? SONG.lines[idx + 1][0]
        : lineStart + 4;
    const lineDur = Math.max(0.001, lineEnd - lineStart);
    const progress = constrain((t - lineStart) / lineDur, 0, 1);

    // Draw as if the canvas is the whole mosaic (cols * width, rows * height),
    // then translate so only this piece's cell is visible on-screen.
    // Same trick as sample-sketch.html — this is what "cut into fragments" means.
    const W = width * cols;
    const H = height * rows;

    // Measure text at a probe size, then scale so it spans ~90% of
    // the virtual canvas width. Cap by height so single-screen still looks good.
    const fontFamily = '"PingFang TC", "Heiti TC", "STHeiti", "Microsoft JhengHei", "Noto Sans TC", sans-serif';
    textStyle(BOLD);
    textAlign(CENTER, CENTER);
    textFont(fontFamily);

    // Measure at a fixed probe size using the canvas context directly,
    // because p5.js may not apply textSize() before textWidth() measures.
    drawingContext.font = 'bold 100px ' + fontFamily;
    const probeWidth = drawingContext.measureText(currentText).width;
    const fontSize = Math.min(100 * (W * 0.9) / probeWidth, H * 0.8);
    textSize(fontSize);

    const cx = W / 2;
    const cy = H * 0.55;
    const strokeW = fontSize * OUTLINE_RATIO;

    drawingContext.lineJoin = 'round';
    drawingContext.lineCap  = 'round';

    push();
    translate(-col * width, -row * height);

    const tw = textWidth(currentText);
    const leftEdge = cx - tw / 2;
    const sweepX = leftEdge + tw * progress;

    // Right of sweep (unsung): black outline + white fill.
    drawingContext.save();
    drawingContext.beginPath();
    drawingContext.rect(sweepX, 0, W - sweepX, H);
    drawingContext.clip();
    drawOutlinedText(currentText, cx, cy, strokeW, UNSUNG_OUTLINE, UNSUNG_FILL);
    drawingContext.restore();

    // Left of sweep (sung): white outline + electric blue fill.
    drawingContext.save();
    drawingContext.beginPath();
    drawingContext.rect(0, 0, sweepX, H);
    drawingContext.clip();
    drawOutlinedText(currentText, cx, cy, strokeW, SUNG_OUTLINE, SUNG_FILL);
    drawingContext.restore();

    pop();
}

function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
